<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11131d" />
    <meta name="description" content="Choose a game and play it in Playground." />
    <title>Playground — Choose a game</title>
    <link rel="stylesheet" href="styles.css?v=14" />
    <script src="games.js?v=10" defer></script>
  </head>
  <body>
    <section class="unlock-screen" id="unlock-screen" aria-labelledby="unlock-title">
      <form class="unlock-card" id="unlock-form">
        <span class="unlock-brand" aria-hidden="true">P</span>
        <p class="eyebrow">PLAYGROUND</p>
        <h1 id="unlock-title">Enter code</h1>
        <label for="access-code">4-digit access code</label>
        <div class="unlock-controls">
          <input
            id="access-code"
            name="access-code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{4}"
            minlength="4"
            maxlength="4"
            autocomplete="off"
            required
            aria-describedby="unlock-error" />
          <button type="submit">Unlock</button>
        </div>
        <p class="unlock-error" id="unlock-error" role="alert" aria-live="polite" hidden>That code did not work. Try again.</p>
      </form>
    </section>
    <div id="site-content" hidden>
    <header class="topbar">
      <a class="brand" href="./" data-home-link aria-label="Playground home"><span>P</span> playground</a>
      <nav class="game-tabs" role="tablist" aria-label="Pages and games">
        <button class="game-tab active" type="button" role="tab" aria-selected="true" data-screen="home">Home</button>
      </nav>
      <a class="direct-link" id="direct-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Open directly ↗</a>
    </header>
    <main>
      <section class="home-screen" id="home-screen" aria-labelledby="home-title">
        <div class="home-heading">
          <p class="eyebrow">PLAYGROUND</p>
          <h1 id="home-title">Choose a game</h1>
        </div>
        <p class="home-message">This was made by members of the Olympus AI club and should be used responsibly</p>
        <div class="game-grid" id="game-grid" aria-label="Games"></div>
      </section>

      <section class="game-shell hidden" id="player-screen" aria-label="Game player">
        <div class="game-heading">
          <div>
            <p class="eyebrow" id="game-type">BROWSER GAME</p>
            <h1 id="game-name">Game</h1>
          </div>
        </div>
        <div class="player" id="game-player">
          <iframe
            id="game-frame"
            title="Game player"
            src="about:blank"
            allow="autoplay; fullscreen; gamepad; pointer-lock"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </section>
    </main>
    </div>
  </body>
</html>
