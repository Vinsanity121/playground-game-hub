name: Deploy game hub to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'games.js'
      - 'games/crossy-road/**'
      - 'games/catalog-sample/**'
      - 'scripts/download-polytrack.mjs'
      - '.github/workflows/cloudflare-gamehub.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-gamehub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare self-hosted PolyTrack
        run: node scripts/download-polytrack.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Export and place game files
        run: |
          git clone https://github.com/EvanBacon/Expo-Crossy-Road.git "$RUNNER_TEMP/crossy-road-source"
          git -C "$RUNNER_TEMP/crossy-road-source" checkout 6f2e84e580c9c8f2b432aa365f706d45d96d8bc9
          cd "$RUNNER_TEMP/crossy-road-source"
          node -e 'const fs=require("node:fs");const p="app.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.expo.experiments={...c.expo.experiments,baseUrl:"/games/crossy-road"};fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          pnpm install --no-frozen-lockfile
          pnpm exec expo export -p web
          mkdir -p "$GITHUB_WORKSPACE/games/crossy-road"
          cp -R dist/. "$GITHUB_WORKSPACE/games/crossy-road/"
          cp LICENSE README.md "$GITHUB_WORKSPACE/games/crossy-road/"

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Add it under repository Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Create Cloudflare Pages project if needed
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create playground-games-hub --production-branch=main

      # Publish the latest hub pages and self-hosted game assets.
      - name: Deploy game hub
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=playground-games-hub --branch=main
