name: Deploy private-hub notice to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'goodgames/**'
      - '.github/workflows/goodgames-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare non-game landing page
        run: |
          mkdir -p "$RUNNER_TEMP/game-hub-site"
          cat > "$RUNNER_TEMP/game-hub-site/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Playground</title>
          <main style="max-width:42rem;margin:12vh auto;padding:2rem;font:16px/1.6 system-ui,sans-serif">
            <h1>Playground</h1>
            <p>This address no longer hosts the game files.</p>
          </main>
          </html>
          HTML
          printf 'Game files are not published from this address.\n' > "$RUNNER_TEMP/game-hub-site/robots.txt"
      - name: Upload landing page
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/game-hub-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
