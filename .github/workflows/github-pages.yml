name: Deploy game hub to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'goodgames/**'
      - '.github/workflows/goodgames-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare public game hub only
        run: |
          mkdir -p "$RUNNER_TEMP/game-hub-site"
          cp index.html styles.css games.js "$RUNNER_TEMP/game-hub-site/"
          mkdir -p "$RUNNER_TEMP/game-hub-site/games"
          cp -R games/. "$RUNNER_TEMP/game-hub-site/games/"
      - name: Build licensed community games
        env:
          DOGE_CE_SHA: 593dde97817024b7665304008beda5b8a775cb23
          CROSSY_SOURCE_SHA: 6727863e14d947c12085c55a7fe423ce05fcd4bf
          CROSSY_ASSETS_SHA: 6f2e84e580c9c8f2b432aa365f706d45d96d8bc9
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/game-hub-site"
          doge="$RUNNER_TEMP/dogeminerce-source"
          crossy="$RUNNER_TEMP/crossyroad-source"

          git clone --filter=blob:none --no-checkout https://github.com/DogeminerCE/DogeminerCE.git "$doge"
          git -C "$doge" fetch --depth=1 origin "$DOGE_CE_SHA"
          git -C "$doge" sparse-checkout init --no-cone
          git -C "$doge" sparse-checkout set --no-cone '/play/' '/assets/' '/LICENSE' '/Asset License'
          git -C "$doge" checkout --detach "$DOGE_CE_SHA"
          mkdir -p "$site/games/dogeminer-ce" "$site/games/assets"
          cp -R "$doge/play/." "$site/games/dogeminer-ce/"
          cp -R "$doge/assets/." "$site/games/assets/"
          cp "$doge/LICENSE" "$site/games/dogeminer-ce/CODE-LICENSE.txt"
          cp "$doge/Asset License" "$site/games/dogeminer-ce/ASSET-LICENSE.txt"
          cat > "$site/games/dogeminer-ce/SOURCE.txt" <<'EOF'
          Dogeminer Community Edition source: https://github.com/DogeminerCE/DogeminerCE
          Pinned source revision: 593dde97817024b7665304008beda5b8a775cb23
          Code license: see CODE-LICENSE.txt. Art, audio, characters and branding have separate terms in ASSET-LICENSE.txt.
          Olympus AI Club changes in this free fan mod: hub navigation and credits added; Firebase cloud saves and supporter purchase flow removed. Progress stays in this browser.
          EOF
          python3 - "$site/games/dogeminer-ce/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          page = Path(sys.argv[1])
          html = page.read_text()

          def remove_div_at(source, start):
              tokens = re.compile(r'</?div\\b[^>]*>', re.I)
              depth = 0
              for token in tokens.finditer(source, start):
                  depth += -1 if token.group(0).lower().startswith('</div') else 1
                  if depth == 0:
                      return source[:start] + source[token.end():]
              raise RuntimeError('Could not find closing div while removing mod-disabled UI.')

          def remove_div_id(source, element_id):
              pattern = re.compile(r'<div\\b[^>]*\\bid=["\\']' + re.escape(element_id) + r'["\\'][^>]*>', re.I)
              match = pattern.search(source)
              return remove_div_at(source, match.start()) if match else source

          for element_id in ('supporter-modal', 'supporter-stat-display', 'supporter-settings-section'):
              html = remove_div_id(html, element_id)

          cloud_title = html.find('<h3>Cloud Save</h3>')
          if cloud_title >= 0:
              cloud_section = html.rfind('<div', 0, cloud_title)
              html = remove_div_at(html, cloud_section)

          firebase_start = html.find('    <!-- Firebase SDK -->')
          firebase_end = html.find('    <!-- Scripts -->', firebase_start)
          if firebase_start < 0 or firebase_end < 0:
              raise RuntimeError('Firebase block markers were not found.')
          html = html[:firebase_start] + '    <!-- Cloud saves and analytics are disabled in this free club mod. -->\\n\\n' + html[firebase_end:]
          html = html.replace("                'js/cloud-save.js?v=4',\\n", '')
          html = '\\n'.join(line for line in html.splitlines() if '../favicon_io/' not in line)

          style = '''
          <style>
            #club-mod-credit { position: fixed; top: 8px; left: 8px; z-index: 999999; display: flex; align-items: flex-start; gap: 6px; font: 700 11px/1.35 system-ui, sans-serif; color: #fff; }
            #club-mod-credit > a, #club-mod-credit summary { display: block; border: 1px solid #ffffff55; border-radius: 999px; padding: 7px 10px; color: #fff; background: #17213de8; text-decoration: none; cursor: pointer; }
            #club-mod-credit details > div { max-width: 320px; margin-top: 6px; padding: 10px 12px; border: 1px solid #ffffff55; border-radius: 12px; background: #17213df2; font-weight: 500; }
            #club-mod-credit details a { color: #ffe08a; }
          </style>
          '''
          credit = '''
          <aside id="club-mod-credit" aria-label="Club mod information">
            <a href="../../" aria-label="Return to the game hub">← Hub</a>
            <details>
              <summary>Club mod · credits</summary>
              <div>
                Free, non-commercial fan mod by Olympus AI Club. Original code and creators are credited in the included license files. Assets by rkn and Babylion122 are covered by the separate non-commercial terms. Cloud saves and supporter purchases are disabled; progress is saved in this browser.
                <p><a href="SOURCE.txt">Source, changes, and license notes</a></p>
              </div>
            </details>
          </aside>
          '''
          if '</head>' not in html or '<body>' not in html:
              raise RuntimeError('Expected Dogeminer page structure was not found.')
          html = html.replace('</head>', style + '\\n</head>', 1)
          html = html.replace('<body>', '<body>\\n' + credit, 1)
          page.write_text(html)
          PY

          git clone --depth=1 https://github.com/ibrahim-sall/crossyroad.git "$crossy"
          git -C "$crossy" fetch --depth=1 origin "$CROSSY_SOURCE_SHA"
          git -C "$crossy" checkout --detach "$CROSSY_SOURCE_SHA"
          python3 - "$crossy" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          main_file = root / 'src/main.js'
          main = main_file.read_text()
          import_line = "import { saveScore, displayLeaderboard } from './leaderboard.js';\\n"
          if import_line not in main:
              raise RuntimeError('Expected leaderboard import not found.')
          main = main.replace(import_line, '')
          start = main.find('function popUpLoose() {')
          if start < 0:
              raise RuntimeError('Game-over function not found.')
          main = main[:start] + '''function popUpLoose() {
            const loosePopup = document.createElement('div');
            loosePopup.id = 'loosePopup';

            const scoreMessage = document.createElement('div');
            scoreMessage.innerText = 'Score: ' + currentScore;
            scoreMessage.id = 'scoreMessage';

            const bestScoreMessage = document.createElement('div');
            bestScoreMessage.innerText = 'Best Score: ' + getBestScore();
            bestScoreMessage.id = 'bestScoreMessage';

            const restartButton = document.createElement('button');
            restartButton.innerText = 'Restart';
            restartButton.id = 'restartButton';
            restartButton.addEventListener('click', () => window.location.reload());

            loosePopup.append(scoreMessage, bestScoreMessage, restartButton);
            document.body.appendChild(loosePopup);
          }
          '''
          main_file.write_text(main)

          html = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#87c6dd">
            <title>Road Crossing · Community Clone</title>
            <link rel="stylesheet" href="./src/main.css">
            <style>
              #club-credit { position: fixed; top: 8px; left: 8px; z-index: 10000; display: flex; gap: 6px; font: 700 11px/1.35 system-ui, sans-serif; color: white; }
              #club-credit > a, #club-credit summary { border: 1px solid #ffffff66; border-radius: 999px; padding: 7px 10px; color: white; background: #102238e8; text-decoration: none; cursor: pointer; }
              #club-credit details > div { max-width: 340px; margin-top: 6px; padding: 10px 12px; border: 1px solid #ffffff66; border-radius: 12px; background: #102238f2; font-weight: 500; }
              #club-credit details a { color: #ffe08a; }
            </style>
          </head>
          <body>
            <div id="container"></div>
            <aside id="club-credit" aria-label="Community clone information">
              <a href="../../">← Hub</a>
              <details>
                <summary>Community clone · credits</summary>
                <div>
                  Free educational community clone, not the official Crossy Road game. Source code by the project authors is under GPL-3.0; 3D models and audio are credited to Evan Bacon under MIT. Firebase score uploads and the online leaderboard were removed; scores stay on this device.
                  <p><a href="./source/SOURCE.md">Source and license notices</a></p>
                </div>
              </details>
            </aside>
            <script type="module" src="./src/main.js"></script>
          </body>
          </html>
          '''
          (root / 'index.html').write_text(html)
          (root / 'src/firebase-config.js').unlink(missing_ok=True)
          (root / 'src/leaderboard.js').unlink(missing_ok=True)
          PY

          mkdir -p "$crossy/dist"
          (cd "$crossy" && npm ci && npm run build -- --base=./)
          crossy_site="$site/games/crossy-road"
          mkdir -p "$crossy_site"
          cp -R "$crossy/dist/." "$crossy_site/"
          mkdir -p "$crossy_site/source/src" "$crossy_site/source/public" "$crossy_site/licenses"
          cp -R "$crossy/src/." "$crossy_site/source/src/"
          cp -R "$crossy/public/." "$crossy_site/source/public/"
          cp "$crossy/index.html" "$crossy/package.json" "$crossy/package-lock.json" "$crossy/vite.config.js" "$crossy_site/source/"
          cp "$crossy/LICENSE" "$crossy_site/licenses/GPL-3.0.txt"
          cp "$crossy/LICENSE" "$crossy_site/source/LICENSE"
          curl -fsSL "https://raw.githubusercontent.com/EvanBacon/Expo-Crossy-Road/$CROSSY_ASSETS_SHA/LICENSE" -o "$crossy_site/licenses/MIT-EvanBacon.txt"
          cat > "$crossy_site/source/SOURCE.md" <<'EOF'
          # Road Crossing community clone
          Source project: https://github.com/ibrahim-sall/crossyroad
          Pinned revision: 6727863e14d947c12085c55a7fe423ce05fcd4bf
          This modified browser build removes the Firebase configuration, score uploads, and online leaderboard. Scores are stored locally. The project code is GPL-3.0; see LICENSE.
          The upstream README credits 3D models and audio to https://github.com/EvanBacon/Expo-Crossy-Road under MIT. The MIT notice is in ../licenses/MIT-EvanBacon.txt.
          This is an unofficial educational community clone and is not affiliated with Hipster Whale.
          EOF
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/game-hub-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
