name: Deploy Good Games to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'goodgames/**'
      - '.github/workflows/goodgames-deploy.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: goodgames-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Pages project if needed
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create goodgames-playzone --production-branch=main
          workingDirectory: goodgames
      - name: Deploy site
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=goodgames-playzone --branch=main
          workingDirectory: goodgames
