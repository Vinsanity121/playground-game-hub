<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2a">
<title>Road Hopper</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:#101a2a;color:#f7f5ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,#1e3550,#101a2a 68%)}
.shell{width:min(100%,620px);display:grid;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{margin:0;font-size:clamp(22px,5vw,32px);letter-spacing:-.04em}.title span{color:#8de0a5}.stats{display:flex;gap:8px}.stat{min-width:78px;text-align:center;padding:8px 12px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff0c}.stat b{display:block;font-size:18px}.stat small{color:#9fb0c1;font-size:10px;letter-spacing:.12em}
.stage{position:relative;overflow:hidden;border:1px solid #ffffff2b;border-radius:22px;background:#172638;box-shadow:0 22px 60px #0006;touch-action:none}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:576/640}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#0d1726bd;backdrop-filter:blur(5px);text-align:center}.overlay[hidden]{display:none}.panel{width:min(100%,360px);padding:26px;border:1px solid #ffffff30;border-radius:20px;background:#172638f2;box-shadow:0 12px 40px #0006}.panel h2{margin:0 0 8px;font-size:30px;letter-spacing:-.04em}.panel p{margin:0 0 18px;color:#c2d0dc;line-height:1.5}.start{border:0;border-radius:12px;padding:12px 24px;background:#8de0a5;color:#102030;font-weight:850;font-size:16px;cursor:pointer}.hint{color:#9fb0c1;font-size:13px;text-align:center}.touch{display:none;justify-content:center;align-items:center;gap:10px}.touch button{width:54px;height:48px;border:1px solid #ffffff2b;border-radius:14px;background:#ffffff12;color:white;font-size:21px;touch-action:manipulation}
@media(max-width:700px){.touch{display:flex}.hint{font-size:12px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><h1 class="title"><span>ROAD</span> HOPPER</h1><div class="stats"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="best">0</b><small>BEST</small></div></div></header>
<div class="stage">
<canvas id="game" width="576" height="640" aria-label="Road Hopper game. Use arrow keys or WASD to move."></canvas>
<div class="overlay" id="overlay"><div class="panel"><h2 id="message">Road Hopper</h2><p id="detail">Cross roads, streams, and rail lines. Keep moving and watch for traffic.</p><button class="start" id="start">Start game</button></div></div>
</div>
<div class="touch" aria-label="Touch controls"><button data-move="left" aria-label="Move left">←</button><button data-move="back" aria-label="Move back">↓</button><button data-move="forward" aria-label="Move forward">↑</button><button data-move="right" aria-label="Move right">→</button></div>
<p class="hint">Move: arrow keys or WASD · Pause: P · Every safe step forward adds a point</p>
</main>
<script>
(() => {
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay'), startBtn = document.getElementById('start');
const message = document.getElementById('message'), detail = document.getElementById('detail');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const W=576,H=640,T=64,C=9,PLAYER_Y=8*T+T/2,ROAD_W=W;
let rows=[],player,score=0,best=Number(localStorage.getItem('road-hopper-best')||0),running=false,last=0,moveLock=0,paused=false;
bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a);
function makeRow(n){
 if(n<=1 || n%7===0)return {n,type:'grass',tone:Math.floor(rand(0,3)),objects:[],coin:Math.random()<.2?Math.floor(rand(1,C-1)):null};
 let r=Math.random(),type=r<.48?'grass':r<.77?'road':r<.94?'water':'rail';
 if(n%13===0)type='grass';
 const row={n,type,tone:Math.floor(rand(0,3)),objects:[],coin:Math.random()<.16?Math.floor(rand(1,C-1)):null};
 if(type==='road'||type==='water'){
  const count=type==='road'?Math.floor(rand(2,4)):Math.floor(rand(2,4));
  const dir=Math.random()<.5?1:-1, speed=dir*rand(type==='road'?55:28,type==='road'?105:48);
  const min=type==='road'?44:86,max=type==='road'?78:148;
  for(let i=0;i<count;i++){const width=rand(min,max);row.objects.push({x:(W/count)*i+rand(-30,30),w:width,speed,kind:type==='road'?'car':'log',color:['#f19a49','#62c7d2','#e77879','#9d8be8'][Math.floor(rand(0,4))]})}
 } else if(type==='rail'){
  const dir=Math.random()<.5?1:-1;
  row.train={dir,phase:rand(0,11),x:-600,w:500};
 }
 return row;
}
function ensureRows(){
 const target=Math.min(140,player.row+18);
 for(let n=0;n<=target;n++)if(!rows[n])rows[n]=makeRow(n);
}
function reset(){
 rows=[];player={row:0,x:W/2,raft:null};score=0;moveLock=0;paused=false;scoreEl.textContent='0';ensureRows();running=true;overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)
}
function endGame(won=false){
 running=false;overlay.hidden=false;
 message.textContent=won?'You made it!':'Run over';
 detail.textContent=won?'You crossed the whole route. Want another go?':'You scored '+score+'. Try a different route and see if you can beat your best.';
 startBtn.textContent='Play again';
 if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('road-hopper-best',String(best))}
}
function move(direction){
 if(!running||paused||moveLock>0)return;
 moveLock=145;
 if(direction==='left')player.x=Math.max(T/2,player.x-T);
 if(direction==='right')player.x=Math.min(W-T/2,player.x+T);
 if(direction==='forward'){player.row++;score=Math.max(score,player.row);scoreEl.textContent=score;ensureRows();player.raft=null}
 if(direction==='back')player.row=Math.max(0,player.row-1),player.raft=null;
 const row=rows[player.row];
 if(row.type==='water'){
  const raft=row.objects.find(o=>player.x+13>o.x && player.x-13<o.x+o.w);
  if(!raft){endGame();return} player.raft=raft;
 }else if(row.type==='road'&&row.objects.some(o=>player.x+13>o.x&&player.x-13<o.x+o.w)){endGame();return}
 if(player.row>=58)endGame(true);
}
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function drawRow(row,y,now){
 if(row.type==='grass'){
  ctx.fillStyle=['#548d68','#5b9870','#4e8663'][row.tone];ctx.fillRect(0,y,W,T);
  ctx.fillStyle='#ffffff0a';for(let i=0;i<6;i++)ctx.fillRect((i*103+row.n*37)%W,y+((i*29+row.n*11)%T),18,3);
  if(row.coin!==null){const cx=row.coin*T+T/2,cy=y+T/2;ctx.fillStyle='#f7cf66';ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2b2';ctx.beginPath();ctx.arc(cx-3,cy-3,3,0,Math.PI*2);ctx.fill()}
 } else if(row.type==='road'){
  ctx.fillStyle='#3a424c';ctx.fillRect(0,y,W,T);ctx.fillStyle='#e8e0c7';ctx.fillRect(0,y+5,W,3);
  for(let x=0;x<W;x+=78){ctx.fillStyle='#d6d0b3';ctx.fillRect(x+13,y+T/2-2,36,4)}
  for(const o of row.objects){const x=o.x,w=o.w;rounded(x,y+13,w,T-26,11,o.color);rounded(x+10,y+9,Math.max(16,w-20),11,5,'#d6f2f0');ctx.fillStyle='#253241';ctx.fillRect(x+8,y+T-14,13,5);ctx.fillRect(x+w-21,y+T-14,13,5)}
 } else if(row.type==='water'){
  ctx.fillStyle='#397fa3';ctx.fillRect(0,y,W,T);ctx.fillStyle='#ffffff18';for(let i=0;i<4;i++)ctx.fillRect((i*131+row.n*19)%W,y+13+i*13,55,2);
  for(const o of row.objects){rounded(o.x,y+11,o.w,T-22,13,'#98704d');ctx.fillStyle='#c49a68';ctx.fillRect(o.x+10,y+16,Math.max(0,o.w-20),5);ctx.fillStyle='#76563f';ctx.fillRect(o.x+8,y+T-21,Math.max(0,o.w-16),4)}
 } else {
  ctx.fillStyle='#555963';ctx.fillRect(0,y,W,T);ctx.fillStyle='#c8bda2';ctx.fillRect(0,y+9,W,3);ctx.fillRect(0,y+T-12,W,3);
  for(let x=0;x<W;x+=32){ctx.fillStyle='#2d3138';ctx.fillRect(x,y+17,5,T-34)}
  if(row.train){const tr=row.train;if(tr.phase>5&&tr.phase<9){const p=(tr.phase-5)/4;tr.x=tr.dir>0?(-tr.w+p*(W+tr.w)):(W-p*(W+tr.w));rounded(tr.x,y+16,tr.w,T-32,7,'#d45c4e');for(let x=tr.x+20;x<tr.x+tr.w-10;x+=70){ctx.fillStyle='#f6d18a';ctx.fillRect(x,y+24,40,18)}}}
 }
}
function drawPlayer(){
 const x=player.x,y=PLAYER_Y;
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+20,19,7,0,0,Math.PI*2);ctx.fill();
 rounded(x-15,y-15,30,34,9,'#3c74d9');rounded(x-12,y-29,24,22,9,'#f0c27c');
 ctx.fillStyle='#273342';ctx.fillRect(x-7,y-19,4,4);ctx.fillRect(x+4,y-19,4,4);
 rounded(x-20,y-7,9,22,4,'#f0c27c');rounded(x+11,y-7,9,22,4,'#f0c27c');
}
function loop(now){
 if(!running)return;
 const dt=Math.min(.04,(now-last)/1000);last=now;if(moveLock>0)moveLock-=dt*1000;
 if(!paused){
  for(const row of rows){
   if(!row)continue;
   if(row.type==='road'||row.type==='water'){
    for(const o of row.objects){o.x+=o.speed*dt;if(o.speed>0&&o.x>W+20)o.x=-o.w-20;if(o.speed<0&&o.x+o.w<-20)o.x=W+20}
   }
   if(row.type==='rail'&&row.train){row.train.phase+=dt;if(row.train.phase>=11)row.train.phase-=11}
  }
  const row=rows[player.row];
  if(row.type==='water'){
   if(player.raft){player.x+=player.raft.speed*dt;if(player.x<10||player.x>W-10){endGame();return}}
   else if(!row.objects.some(o=>player.x+13>o.x&&player.x-13<o.x+o.w)){endGame();return}
  }else if(row.type==='road'&&row.objects.some(o=>player.x+13>o.x&&player.x-13<o.x+o.w)){endGame();return}
  if(row.type==='rail'&&row.train&&row.train.phase>5&&row.train.phase<9){const tr=row.train;if(player.x>tr.x-12&&player.x<tr.x+tr.w+12){endGame();return}}
  if(row.coin!==null&&player.x>row.coin*T&&player.x<(row.coin+1)*T){score+=5;scoreEl.textContent=score;row.coin=null}
 }
 ctx.clearRect(0,0,W,H);
 for(let s=-1;s<10;s++){const n=player.row+(8-s);const row=rows[n];if(row)drawRow(row,s*T,now)}
 drawPlayer();
 requestAnimationFrame(loop)
}
document.addEventListener('keydown',e=>{
 const key=e.key.toLowerCase(),map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'forward',w:'forward',arrowdown:'back',s:'back'};
 if(key==='p'&&running){paused=!paused;return}
 if(map[key]){e.preventDefault();move(map[key])}
});
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));
startBtn.addEventListener('click',reset);
ensureRows();drawRow(rows[0],8*T,0);drawPlayer();
})();
</script>
</body>
</html>
